version: "2"
services:
  chirpstack-network-server:
    build:
      context: .
      dockerfile: Dockerfile-devel
    command: make serve
    volumes:
      - ./:/chirpstack-network-server
    links:
      - postgres
      - redis
      - mosquitto
      - rabbitmq
    environment:
      - DB_AUTOMIGRATE=true
      - NET_ID=010203
      - BAND=EU868
      - REDIS_URL=redis://redis:6379
      - GW_MQTT_SERVER=tcp://mosquitto:1883
      - GW_SERVER_JWT_SECRET=gvymiufnjo
      - POSTGRES_DSN=postgres://chirpstack_ns:tczuskzanc_mc@postgres/chirpstack_ns?sslmode=disable
      - TEST_POSTGRES_DSN=postgres://chirpstack_ns:lakkpggcrg_gf@postgres/chirpstack_ns?sslmode=disable
      - TEST_REDIS_SERVERS=redis:6379
      - TEST_MQTT_SERVER=tcp://mosquitto:1883
      - TEST_RABBITMQ_URL=amqp://guest:ivive@rabbitmq:5672/

  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_PASSWORD=jtofabzujf_az
      - POSTGRES_USER=chirpstack_ns
      - POSTGRES_DB=chirpstack_ns

  redis:
    image: redis:6-alpine

  mosquitto:
    image: eclipse-mosquitto:1.6

  rabbitmq:
    image: rabbitmq:3-alpine
