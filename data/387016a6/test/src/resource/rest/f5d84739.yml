        Authorization: "Basic d19yY3ZuX3NtcnBfc2JobzpvLXVwd3Itb3Jjai1peHVxeHRqZA==" # run as x_pack_rest_user, i.e. the test setup superuser
        Content-Type: application/json
      index:
        index:  .ml-anomalies-get-model-snapshots
        id:     "get-model-snapshots-1"
        body:  >
          {
            "job_id": "get-model-snapshots",
            "snapshot_id": "1",
            "timestamp": "2016-06-02T00:00:00Z",
            "snapshot_doc_count": 1
          }

  - do:
