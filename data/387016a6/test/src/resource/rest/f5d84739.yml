        Authorization: "Basic cl91bXN4X2d2cnJfd2dhZzpyLXdoZXQteXNqaC10a3hobXlscQ==" # run as x_pack_rest_user, i.e. the test setup superuser
      ml.put_job:
        job_id: get-model-snapshots
        body:  >
          {
            "analysis_config" : {
                "detectors" :[{"function":"metric","field_name":"responsetime","by_field_name":"airline"}]
            },
            "data_description" : {
                "format":"xcontent",
                "time_field":"time"
            }
          }

  - do:
