setup:
  - skip:
      features: headers
  - do:
      indices.create:
        index: foo
        body:
          mappings:
            properties:
              the_field:
                type: date
              value_field:
                type: integer

  - do:
      headers:
        Authorization: "Basic eF9sdGdlX3hzaG1faHRhbTpjLWtxYW4tYWV3eS1hY29oYWVsdA==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "foo_rollup",
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "value_field",
                "metrics": ["min", "max", "sum"]
              }
            ]
          }

---
"Test stop nonexistent job":

  - do:
      catch: /Task for Rollup Job \[does_not_exist\] not found/
      headers:
        Authorization: "Basic dF9xdXVtX2JvdXpfaHFkeTp2LWNsc3YtZXZ2eC1iZnFwdW1vbw==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.stop_job:
        id: does_not_exist


---
"Test stop job twice":

  - do:
      headers:
        Authorization: "Basic Yl9zaWVmX3pneWtfanB5ZzptLXFubGktc29seC1sZnBiZmx0Yw==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.start_job:
        id: foo
  - is_true: started

  - do:
      headers:
        Authorization: "Basic dF9ocmZuX2l3b2Rfc2xzcjplLWVkdWEtZnF2aC1yYm5haWJ5dA==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.stop_job:
        id: foo
  - is_true: stopped

  - do:
      headers:
        Authorization: "Basic cl9uamh5X3liZ2hfcHBxbzp0LXJvanEtcXNqaS12cWRpY2pkaw==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.stop_job:
        id: foo
  - is_true: stopped

---
"Test stop non-started job":

  - do:
      headers:
        Authorization: "Basic Y193anFiX2RtYmpfd2trcDpnLWtzdm0tZnVncy1tZXZmd3dvaA==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.stop_job:
        id: foo

  - is_true: stopped

---
"Test wait_for_completion default timeout":
  - do:
      headers:
        Authorization: "Basic aV9seW9sX3VncWNfamNmdDp3LXVzeGctcXJ1Zi1penNsc2p3aA==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.start_job:
        id: foo
  - is_true: started

  - do:
      headers:
        Authorization: "Basic d19ob2JjX2pncmtfZmtidzp3LXBmZXMtdml3Zy1ub2pvb2N3YQ==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.stop_job:
        id: foo
        wait_for_completion: true
  - is_true: stopped

---
"Test wait_for_completion with custom timeout":
  - do:
      headers:
        Authorization: "Basic cV9vcnNrX3dtbHdfc2dtZzpmLXNqeXUtb2poci12Y3d0Z3NjYQ==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.start_job:
        id: foo
  - is_true: started

  - do:
      headers:
        Authorization: "Basic Z19ka3R3X2Nhb3ZfdmF4ajprLWVrb3cteHlubi1tamFkbm9vaQ==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.stop_job:
        id: foo
        wait_for_completion: true
        timeout: "5s"
  - is_true: stopped

