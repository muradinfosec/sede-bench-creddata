      headers:
        Authorization: "Basic eF9iZHJhX2RrbGhfeWh3dTprLWlyemItbXhhYy11b3N0ZHNrdw==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "non-rollup",
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "value_field",
                "metrics": ["min", "max", "sum"]
              }
            ]
          }


---
"Try to include headers":

  - do:
      catch: /unknown field \[headers\]/
      headers:
        Authorization: "Basic cF9tZ2hhX2FlZ2pfbGdxcTpxLWZndGUtaHJ2Yi1lcGt3dnNycg==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "foo_rollup",
            "headers": {
              "foo": "bar"
            },
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "value_field",
                "metrics": ["min", "max", "sum"]
              }
            ]
          }

---
"Validation failures":

  - do:
      catch: /Could not find a \[numeric\] or \[date,date_nanos\] field with name \[field_doesnt_exist\] in any of the indices matching the index pattern/
      headers:
        Authorization: "Basic Yl94c3llX3Z2aGtfcWh6eTp6LWhpenctbGpzbi1tZ3hlaWdxcg==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "foo_rollup",
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "field_doesnt_exist",
                "metrics": ["min", "max", "sum"]
              }
            ]
          }

---
"Unknown Metric":

  - do:
      catch: /Unsupported metric \[does_not_exist\]/
      headers:
        Authorization: "Basic eV9nbWJnX3hxdnNfcmp3YTpnLXlrbHMtenNicy1heW56YnRsaQ==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "foo_rollup",
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "value_field",
                "metrics": ["min", "max", "sum", "does_not_exist"]
              }
