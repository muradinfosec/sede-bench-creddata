---
"Test put job with templates":

  - do:
      indices.put_template:
        name: test
        body:
          index_patterns: foo_*
          mappings:
            properties:
              field:
                type: keyword

  - do:
      allowed_warnings:
        - "index [foo_rollup] matches multiple legacy templates [global, test], composable templates will only match a single template"
      headers:
        Authorization: "Basic dV9uc2ZuX3ZxY2dfc2Nxbjp0LWt1dngtbG50dS1vY2xkZG9hbg==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "foo_rollup",
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "value_field",
                "metrics": ["min", "max", "sum"]
              }
            ]
          }
  - is_true: acknowledged

  - do:
      indices.get_mapping:
        index: foo_rollup

  - set: {foo_rollup.mappings._meta.rollup-version: version}

  - match:
      foo_rollup:
        mappings:
          _meta:
            _rollup:
              foo:
                id: "foo"
                index_pattern: "foo"
                rollup_index: "foo_rollup"
                cron: "*/30 * * * * ?"
                page_size: 10
                groups :
                  date_histogram:
                    calendar_interval: "1h"
                    field: "the_field"
                    time_zone: "UTC"
                metrics:
                  - field: "value_field"
                    metrics:
                     - "min"
                     - "max"
                     - "sum"
                timeout: "20s"
            rollup-version: $version
          dynamic_templates:
            - strings:
                match_mapping_type: "string"
                mapping:
                  type: "keyword"
            - date_histograms:
                path_match: "*.date_histogram.timestamp"
                mapping:
                  type: "date"
          properties:
            field:
              type: "keyword"



