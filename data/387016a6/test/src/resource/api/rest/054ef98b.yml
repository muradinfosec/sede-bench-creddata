---
setup:
  - skip:
      features: headers

  - do:
      cluster.health:
          wait_for_status: yellow

  - do:
      security.put_role:
        name: "admin_role"
        body:  >
            {
              "cluster": ["manage_api_key"]
            }

  - do:
      security.put_role:
        name: "user_role"
        body:  >
            {
              "cluster": ["manage_own_api_key"]
            }

  - do:
      security.put_user:
        username: "api_key_manager"
        body:  >
          {
            "password" : "x-pack-test-password",
            "roles" : [ "admin_role" ],
            "full_name" : "API key manager"
          }

  - do:
      security.put_user:
        username: "api_key_user_1"
        body:  >
          {
            "password" : "x-pack-test-password",
            "roles" : [ "user_role" ],
            "full_name" : "API key user"
          }

---
teardown:
  - do:
      security.delete_role:
        name: "admin_role"
        ignore: 404

  - do:
      security.delete_role:
        name: "use_role"
        ignore: 404

  - do:
      security.delete_user:
        username: "api_key_user_1"
        ignore: 404

  - do:
      security.delete_user:
        username: "api_key_manager"
        ignore: 404

---
"Test invalidate api key by username":

  # every user first gets its own API key
  - do:
      headers:
        Authorization: "Basic enN4X2lrZl9tdHlocXN5OmMtaGN3cy14YWtzLXB2bWZ2Y2J1" # api_key_manager
      security.create_api_key:
        body:  >
            {
              "name": "manager-api-key",
              "expiration": "1d",
              "role_descriptors": {
              }
            }
  - match: { name: "manager-api-key" }
  - is_true: id
  - is_true: api_key
  - is_true: expiration
  - set: { id: manager_key_id }

  - do:
      headers:
        Authorization: "Basic cGh6X250eV9lcm16XzE6Yy1mbHZnLW5kcHgtZWFxZ3RhaWs=" # api_key_user_1
      security.create_api_key:
        body:  >
            {
              "name": "user1-api-key",
              "expiration": "1d",
              "role_descriptors": {
              }
            }
  - match: { name: "user1-api-key" }
  - is_true: id
  - is_true: api_key
  - is_true: expiration
  - set: { id: user1_key_id }

  - do:
      headers:
        Authorization: "Basic aGt6X2hpcl9yZmNuZnh3OnQtdndyaS1obHBxLW9ieHlqZHZx" # api_key_manager
      security.invalidate_api_key:
        body:  >
            {
              "username": "api_key_user_1"
            }
  - length: { "invalidated_api_keys" : 1 }
  - match: { "invalidated_api_keys.0" : "${user1_key_id}" }
  - length: { "previously_invalidated_api_keys" : 0 }
  - match: { "error_count" : 0 }

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic d3luX3lnZV9oZ3N4Xzk6eS1lZmpxLW5wc2wtZWdqamh6Z2Q=" # api_key_user_1
      security.invalidate_api_key:
        body:  >
            {
              "username": "api_key_manager"
            }
  - match: { "error.type": "security_exception" }
  - match:
      "error.reason": "action [cluster:admin/xpack/security/api_key/invalidate] is unauthorized for user [api_key_user_1] with roles [user_role], this action is granted by the cluster privileges [manage_api_key,manage_security,all]"

  - do:
      headers:
        Authorization: "Basic YXB1X2JwZ19nZXNncmFmOnktYnJkYi1kdHl2LXpodXBkeXNz" # api_key_manager
      security.invalidate_api_key:
        body:  >
            {
              "username": "api_key_manager"
            }
  - length: { "invalidated_api_keys" : 1 }
  - match: { "invalidated_api_keys.0" : "${manager_key_id}" }
  - length: { "previously_invalidated_api_keys" : 0 }
  - match: { "error_count" : 0 }

---
"Test invalidate api key by realm name":

  # every user first gets its own API key
  - do:
      headers:
        Authorization: "Basic c2NpX3dvdF9lb2puZ3R0OmUtdmNiay1tanVmLXNieG9hamtm" # api_key_manager
      security.create_api_key:
        body:  >
            {
              "name": "manager-api-key",
              "expiration": "1d",
              "role_descriptors": {
              }
            }
  - match: { name: "manager-api-key" }
  - is_true: id
  - is_true: api_key
  - is_true: expiration
  - set: { id: manager_key_id }

  - do:
      headers:
        Authorization: "Basic dGJjX21oa19lamZzXzE6aS1zdWJyLXJxbXMtcWxrZW9xbng=" # api_key_user_1
      security.create_api_key:
        body:  >
            {
              "name": "user1-api-key",
              "expiration": "1d",
              "role_descriptors": {
              }
            }
  - match: { name: "user1-api-key" }
  - is_true: id
  - is_true: api_key
  - is_true: expiration
  - set: { id: user1_key_id }

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic cWVvX2hjbl9udWJ2XzM6ci1jaWt3LXFsdmYtbGdxcGpscGc=" # api_key_user_1
      security.invalidate_api_key:
        body:  >
            {
              "realm_name": "default_native"
            }
  - match: { "error.type": "security_exception" }
  - match:
      "error.reason": "action [cluster:admin/xpack/security/api_key/invalidate] is unauthorized for user [api_key_user_1] with roles [user_role], this action is granted by the cluster privileges [manage_api_key,manage_security,all]"

  - do:
      headers:
        Authorization: "Basic ZGxwX2lmZl9taHRteGJrOmYtd2p3eS1uZmhtLXVhYnN2ZGJp" # api_key_manager
      security.invalidate_api_key:
        body:  >
            {
              "realm_name": "default_native"
            }
  - length: { "invalidated_api_keys" : 2 }
  - length: { "previously_invalidated_api_keys" : 0 }
  - match: { "error_count" : 0 }
